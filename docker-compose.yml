services:
  postgres:
    image: postgres:16-alpine
    container_name: dealogue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dealogue
      POSTGRES_PASSWORD: dealogue
      POSTGRES_DB: dealogue
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dealogue -d dealogue']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
